server {
    listen 51980;

    client_max_body_size 5000m;

    location /.well-known/ {
        root /data/xadmin/server/data/;
    }

    location = /robots.txt {
        default_type text/html;
        add_header Content-Type "text/plain; charset=UTF-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /web/health/ {
        access_log off;
        add_header Content-Type 'application/json';
        return 200 '{"status": "ok"}';
    }

    location ^~ /media/ {
        alias /data/xadmin/server/data/upload/;
        try_files $uri $uri/ @media;
    }

    location @media {
        include conf.d/xadmin-api-conf;
    }

    location ~ ^/(api|ws|flower|media|api-docs) {
        include conf.d/xadmin-api-conf;
    }

    location / {
        alias /opt/xadmin-client/;
        try_files $uri $uri/ /index.html;
        # CSP 页面护栏：SPA 由 nginx 托管，django-csp 覆盖不到文档层，同一策略串必须在此下发
        # （与 xadmin-server/server/settings/base.py 的 _CSP_DIRECTIVES 保持一致，改策略需三处同步：
        #  本文件 + xadmin-client/scripts/csp-page-server.mjs（验证服务）——服务端单测有漂移守护）。
        # 2026-09-18 已切强制头（原 report-only）：判据 = 隔离验证
        # `pnpm test:e2e:csp`（构建产物 + 强制头 + 真实浏览器扫核心页面，零违规且探针负对照命中；
        # 因测试服不可达无法累计「连续 7 天真实违规零」，以「全量归因 + 隔离验证」替代观察窗口，
        # 与 2026-09-16 服务端 CSP 切换同口径）。
        # 本期为通过强制头所做的收口（详见 docs/ops/release-checklist.md §1）：
        #   1. index.html 的 window.process 内联脚本改为同源 public/process-shim.js；
        #   2. 新增 worker-src 'self' blob:（version-rocket 的 Blob 轮询 Worker）；
        #   3. 页面层 report-uri 修正为 /api/common/api/csp-report（原路径 404，上报静默丢失）；
        #   4. **前端图标离线化**（2026-09-18）：菜单/选择器图标随包注册或按 set 懒加载
        #      构建期内置的图标集（同源 chunk），connect-src 不再放行任何外部主机——
        #      内网/离线部署可用，且「核心页零违规」可反向证明无外部请求。
        # 回滚：把下面两行换回 Content-Security-Policy-Report-Only（保留同一策略串）后 reload 即可。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/common/api/csp-report" always;
    }
}
