server {
    listen 51980;

    client_max_body_size 5000m;

    # 安全头统一在 server 级下发：add_header 的继承规则是「子级一旦声明即整体不继承」，
    # 各 location 不得再散落安全头声明（新增响应头一律加到这里，避免某 location 丢失其余头）。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS：默认不发（保持 HTTP 直连部署零影响，与 Django 侧 SECURITY_HTTPS_ENABLED 三态口径一致）。
    # TLS 终止于上游网关/LB 且确认全站走 HTTPS 后取消注释启用（含子域时追加 ; includeSubDomains）：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # CSP 页面护栏：SPA 由 nginx 托管，django-csp 覆盖不到文档层，同一策略串必须在此下发
    # （与 xadmin-server/server/settings/base.py 的 _CSP_DIRECTIVES 保持一致，改策略需三处同步：
    #  本文件 + xadmin-client/scripts/csp-page-server.mjs（验证服务）——服务端单测有漂移守护）。
    # 2026-09-18 已切强制头（原 report-only）：判据 = 隔离验证
    # `pnpm test:e2e:csp`（构建产物 + 强制头 + 真实浏览器扫核心页面，零违规且探针负对照命中；
    # 因测试服不可达无法累计「连续 7 天真实违规零」，以「全量归因 + 隔离验证」替代观察窗口，
    # 与 2026-09-16 服务端 CSP 切换同口径）。
    # 本期为通过强制头所做的收口（详见 docs/ops/release-checklist.md §1）：
    #   1. index.html 的 window.process 内联脚本改为同源 public/process-shim.js；
    #   2. 新增 worker-src 'self' blob:（version-rocket 的 Blob 轮询 Worker）；
    #   3. 页面层 report-uri 修正为 /api/common/api/csp-report（原路径 404，上报静默丢失）；
    #   4. **前端图标离线化**（2026-09-18）：菜单/选择器图标随包注册或按 set 懒加载
    #      构建期内置的图标集（同源 chunk），connect-src 不再放行任何外部主机——
    #      内网/离线部署可用，且「核心页零违规」可反向证明无外部请求。
    # 回滚：把下面一行换回 Content-Security-Policy-Report-Only（保留同一策略串）后 reload 即可。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/common/api/csp-report" always;

    location /.well-known/ {
        root /data/xadmin/server/data/;
    }

    location = /robots.txt {
        default_type text/html;
        add_header Content-Type "text/plain; charset=UTF-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /web/health/ {
        access_log off;
        add_header Content-Type 'application/json';
        return 200 '{"status": "ok"}';
    }

    # 媒体文件统一走应用鉴权（登录态），不再有匿名直链：
    # /media/ 转发到后端（Django 校验 Cookie JWT 后返回文件，或按
    # MEDIA_X_ACCEL_PREFIX 配置返回 X-Accel-Redirect 内转到下面的 internal 位置）。
    location ^~ /media/ {
        include conf.d/xadmin-api-conf;
    }

    # 受保护媒体的内部位置：仅 X-Accel-Redirect 内部重定向可达
    # （external 请求 404，不可直接寻址）；前缀与后端 MEDIA_X_ACCEL_PREFIX 一致。
    location ^~ /_protected_media/ {
        internal;
        alias /data/xadmin/server/data/upload/;
    }

    location ~ ^/(api|ws|flower|media|api-docs) {
        include conf.d/xadmin-api-conf;
    }

    # 带内容哈希的构建产物（vite assetsDir=static/js|css|png）：一年 immutable，
    # 内容变化则文件名必然变化，可安全长缓存（用 add_header 而非 expires，保持单头）。
    # 此处有自己的 add_header（Cache-Control），按继承规则不再收到 server 级安全头——
    # 非 HTML 静态资源无 CSP 语义，可接受
    location ^~ /static/ {
        root /opt/xadmin-client;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 入口与运行时公共配置禁止缓存：index.html 引用带哈希的 /static/ 产物，
    # 浏览器缓存旧入口会在发版后引用已删除的 chunk（白屏），必须每次回源以
    # ETag/Last-Modified 校验（expires 指令只写 Expires/Cache-Control，不动 add_header，
    # 因此 server 级安全头在此正常继承——换用 add_header 会让 index.html 丢掉 CSP）
    location = /index.html {
        root /opt/xadmin-client;
        expires -1;
    }

    location = /platform-config.json {
        root /opt/xadmin-client;
        expires -1;
    }

    location / {
        alias /opt/xadmin-client/;
        try_files $uri $uri/ /index.html;
    }
}
