server {
    listen 51980;

    client_max_body_size 5000m;

    location /.well-known/ {
        root /data/xadmin/server/data/;
    }

    location = /robots.txt {
        default_type text/html;
        add_header Content-Type "text/plain; charset=UTF-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /web/health/ {
        access_log off;
        add_header Content-Type 'application/json';
        return 200 '{"status": "ok"}';
    }

    location ^~ /media/ {
        alias /data/xadmin/server/data/upload/;
        try_files $uri $uri/ @media;
    }

    location @media {
        include conf.d/xadmin-api-conf;
    }

    location ~ ^/(api|ws|flower|media|api-docs) {
        include conf.d/xadmin-api-conf;
    }

    location / {
        alias /opt/xadmin-client/;
        try_files $uri $uri/ /index.html;
        # CSP 页面护栏：SPA 由 nginx 托管，django-csp 覆盖不到文档层，同一策略串必须在此下发
        # （与 xadmin-server/server/settings/base.py 的 _CSP_DIRECTIVES 保持一致，改策略需两处同步）。
        # 起步 report-only：违规经 /api/csp-report 上报（与 Django 侧同端点、同合成上报隔离口径），
        # 观察无真实违规后换强制头：把两处 "Report-Only" 去掉即可（回滚同理反向）。
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-report" always;
    }
}
