name: Build and Push Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract repository name
        id: repo
        run: echo "REPO=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: nineaiyu/${{ env.REPO }}
          tags: |
            type=semver,pattern={{version}}

      - name: Wait for client image
        # 本镜像 `FROM nineaiyu/xadmin-client:${VERSION}`：同批 tag 推送时 client 仓的镜像
        # 构建可能尚未完成，buildx 会直接以 "not found" 失败（5.0.0 发布时即如此）。
        # 这里先有界等待客户端镜像出现，使两仓 tag 的推送顺序不再敏感。
        run: |
          set -euo pipefail
          IMAGE="nineaiyu/xadmin-client:${{ steps.meta.outputs.version }}"
          deadline=$(( $(date +%s) + 2400 ))
          until docker buildx imagetools inspect "${IMAGE}" > /dev/null 2>&1; do
            if [[ "$(date +%s)" -ge "${deadline}" ]]; then
              echo "::error::等待客户端镜像超时：${IMAGE}（检查 xadmin-client 的 Build and Push Image）"
              exit 1
            fi
            echo "等待客户端镜像：${IMAGE}"
            sleep 30
          done
          echo "客户端镜像就绪：${IMAGE}"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关闭镜像内的构建溯源附件（OCI 1.1 artifact，config 为
          # application/vnd.oci.empty.v1+json）：下游镜像源（阿里云仓）不支持该 manifest
          # class，带上它会导致该版本镜像无法从 Docker Hub 同步过去。
          provenance: false
